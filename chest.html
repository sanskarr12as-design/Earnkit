<script id="ekDailyTreasureController" type="text/plain">
(function(){
  var root=window.__ekDailyTreasureShadowRoot&&window.__ekDailyTreasureShadowRoot.getElementById('ekSection'); if(!root) return;
  var q=function(s,r){return (r||root).querySelector(s)}, qa=function(s,r){return Array.prototype.slice.call((r||root).querySelectorAll(s))};
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ================= PUBLIC DATA + HOOKS ================= */
  var EK=window.EKSection={
    data:{
      progress:0,                      // ads watched (demo value)
      total:13,                        // ads needed for the chest
      milestones:[5,10,13],            // tile thresholds
      resetIn:22*3600+34*60,           // seconds until daily reset
      claimed:[],                      // indexes of claimed milestones
      rewards:[]                       // e.g. [{title:'50 coins',time:Date.now()}]
    },
    hooks:{                            // override any of these from your app
      onWatchAd:function(){},                    // app hook is connected by the host bridge.
      onProgress:function(d){},
      onMilestone:function(threshold,index,d){}, // tapped an unlocked milestone
      onMilestoneReached:function(threshold,index,d){},
      onChestReady:function(d){},
      onOpenChest:function(d){},                 // chest tapped while unlocked
      onLockedChest:function(d){},               // chest tapped while still locked
      onViewAll:function(rewards){},
      onReset:function(d){}
    },
    setProgress:setProgress, addAd:function(){setProgress(EK.data.progress+1)},
    setTimer:function(sec){EK.data.resetIn=Math.max(0,sec|0);renderTimer()},
    setRewards:function(a){EK.data.rewards=a||[]},
    claim:function(i){if(EK.data.claimed.indexOf(i)<0)EK.data.claimed.push(i);render()},
    reset:function(){EK.data.claimed=[];EK.data.progress=0;render()},
    exact:function(on){root.classList.toggle('ek-live',!on)}, render:render, burst:burst
  };

  /* ================= RENDER ================= */
  var tiles=qa('[data-ek=tile]');
  root.addEventListener('click',function(){root.classList.add('ek-live')},true);
  function render(){
    var d=EK.data,p=d.progress,t=d.total,rem=Math.max(0,t-p);
    if(p>0||d.claimed.length)root.classList.add('ek-live');
    q('[data-ek=count]').textContent=p+' / '+t;
    q('[data-ek=fill]').style.transform='scaleX('+(t?Math.min(p/t,1):0)+')';
    q('[data-ek=hint]').innerHTML=rem?'Watch <b>'+rem+'</b> more ads to unlock':'Chest unlocked! Tap to open';
    var btn=q('[data-ek=open]'); btn.setAttribute('aria-disabled',rem?'true':'false'); btn.classList.toggle('is-ready',!rem);
    tiles.forEach(function(el,i){
      var th=d.milestones[i],f=th?Math.min(p/th,1):0,un=p>=th;
      q('[data-ek=tfill]',el).style.transform='scaleX('+f+')';
      q('[data-ek=pill]',el).textContent=Math.min(p,th)+' / '+th;
      q('[data-ek=lbl]',el).textContent=th+' Ads';
      el.classList.toggle('is-unlocked',un); el.classList.toggle('is-claimed',d.claimed.indexOf(i)>-1);
      el.setAttribute('aria-label',th+' ads surprise, '+(un?'unlocked':'locked'));
    });
    renderTimer();
  }
  function renderTimer(){
    var s=EK.data.resetIn,h=Math.floor(s/3600),m=Math.floor(s%3600/60);
    q('[data-ek=timer]').textContent='Resets in '+(h?h+'h '+m+'m':m+'m '+(s%60)+'s');
  }
  function setProgress(n){
    var d=EK.data,old=d.progress; d.progress=Math.max(0,Math.min(d.total,n|0)); render();
    d.milestones.forEach(function(th,i){
      if(old<th&&d.progress>=th){
        var g=tiles[i],x=+getComputedStyle(g).getPropertyValue('--gx')||0;
        burst(x+121,1330,14); EK.hooks.onMilestoneReached(th,i,d);
      }
    });
    if(old<d.total&&d.progress>=d.total){burst(431,1060,30);EK.hooks.onChestReady(d)}
    EK.hooks.onProgress(d);
  }

  /* ================= CELEBRATION (sprite petals/sparkles) ================= */
  var PIECES=[[30,170,38,38],[782,150,52,42],[70,300,70,62],[91,1690,70,60],[790,700,36,36],[38,780,34,34]];
  function burst(cx,cy,n){
    if(reduce) return; var top=q('[data-ek=top]');
    for(var i=0;i<n;i++){
      var c=PIECES[(Math.random()*PIECES.length)|0],a=Math.random()*6.283,r=120+Math.random()*330,e=document.createElement('span');
      e.className='ek-art ek-pt ek-soft ek-burst';
      e.style.cssText='--x:'+c[0]+';--y:'+c[1]+';--w:'+c[2]+';--h:'+c[3]+';--px:'+(cx-c[2]/2)+';--py:'+(cy-c[3]/2)+
        ';--tx:'+(Math.cos(a)*r|0)+';--ty:'+(Math.sin(a)*r-80|0)+';--rot:'+((Math.random()*540-270)|0)+'deg;--bd:'+(0.9+Math.random()*0.8).toFixed(2)+'s';
      e.addEventListener('animationend',function(){this.remove()}); top.appendChild(e);
    }
  }

  /* ================= EVENTS ================= */
  function act(el,fn){el.addEventListener('click',fn);el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}})}
  act(q('[data-ek=watch]'),function(){EK.hooks.onWatchAd(EK.data)});
  act(q('[data-ek=viewall]'),function(){EK.hooks.onViewAll(EK.data.rewards)});
  tiles.forEach(function(el,i){act(el,function(){var d=EK.data;if(d.progress>=d.milestones[i])EK.hooks.onMilestone(d.milestones[i],i,d)})});
  act(q('[data-ek=open]'),function(){
    var d=EK.data,b=q('[data-ek=open]');
    if(d.progress>=d.total){burst(431,1060,24);EK.hooks.onOpenChest(d)}
    else{b.classList.remove('is-shake');void b.offsetWidth;b.classList.add('is-shake');EK.hooks.onLockedChest(d)}
  });
  q('[data-ek=open]').addEventListener('animationend',function(e){if(e.animationName==='ek-shake')this.classList.remove('is-shake')});

  /* App-backed countdown. The app owns daily progress and reset; this UI never resets it. */
  var __ekTreasureDay=new Date().toDateString();
  setInterval(function(){
    var now=new Date(),next=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
    EK.data.resetIn=Math.max(0,Math.ceil((next-now)/1000));
    if(root.isConnected)renderTimer();
    var day=now.toDateString();
    if(day!==__ekTreasureDay){__ekTreasureDay=day;if(typeof window.__ekDailyTreasureSync==='function')window.__ekDailyTreasureSync();}
  },1000);

  /* pause animations offscreen */
  if('IntersectionObserver' in window)new IntersectionObserver(function(en){root.classList.toggle('ek-paused',!en[0].isIntersecting)}).observe(root);

  render();
})();
</script>

<script id="ek-daily-treasure-shadow-bridge">
(function(){
  'use strict';
  var template=document.getElementById('ek-daily-treasure-template');
  var shadowHost=null,shadowRoot=null,ui=null;
  function secondsToReset(){
    var now=new Date(),next=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
    return Math.max(0,Math.ceil((next-now)/1000));
  }
  function syncFromApp(){
    if(!ui||!window.EK38)return;
    try{
      var chest=ensureChestProgress();
      var ms=window.EK38.msState();
      ui.data.progress=Math.min(13,Math.max(0,Number(chest.adCount)||0));
      ui.data.total=13;
      ui.data.milestones=window.EK38.MS.map(function(row){return Number(row[0]);});
      ui.data.claimed=ui.data.milestones.map(function(threshold,index){return ms.claimed[threshold]?index:-1;}).filter(function(index){return index>=0;});
      ui.data.resetIn=secondsToReset();
      ui.setRewards((state.activity||[]).filter(function(item){return /lucky chest/i.test(String(item.title||''));}));
      ui.hooks.onWatchAd=function(){return window.EK38.watchAd();};
      ui.hooks.onMilestone=function(threshold){return window.EK38.claimMs(Number(threshold));};
      ui.hooks.onOpenChest=function(){return window.EK38.openChest();};
      ui.hooks.onLockedChest=function(){return window.EK38.openChest();};
      ui.hooks.onViewAll=function(){return window.EK38.go('activity');};
      ui.hooks.onProgress=function(){};
      ui.hooks.onMilestoneReached=function(){};
      ui.hooks.onChestReady=function(){};
      ui.hooks.onReset=function(){};
      ui.render();
      /* Mirror the app's once-per-day chest state without changing the source artwork. */
      var opened=state.chest.date===today()&&!!state.chest.opened;
      var openButton=shadowRoot.querySelector('[data-ek="open"]');
      var openLabel=shadowRoot.querySelector('.ek-t-open');
      if(openButton){openButton.disabled=opened;openButton.setAttribute('aria-disabled',opened||ui.data.progress<13?'true':'false');}
      if(openLabel)openLabel.textContent=opened?'Chest Claimed':'Open Chest';
    }catch(error){console.error('Daily Treasure sync failed',error);}
  }
  function mount(){
    var mountPoint=document.getElementById('ekDailyTreasureMount');
    if(!template||!mountPoint||currentRoute!=='chest')return;
    if(!shadowHost){
      shadowHost=document.createElement('div');
      shadowRoot=shadowHost.attachShadow({mode:'open'});
      shadowRoot.appendChild(template.content.cloneNode(true));
      mountPoint.appendChild(shadowHost);
      window.__ekDailyTreasureShadowRoot=shadowRoot;
      var source=shadowRoot.getElementById('ekDailyTreasureController');
      if(!source)throw new Error('Daily Treasure controller template is missing');
      var runner=document.createElement('script');
      runner.textContent=source.textContent;
      document.head.appendChild(runner);
      runner.remove();
      ui=window.EKSection;
    }else{
      mountPoint.appendChild(shadowHost);
    }
    syncFromApp();
  }
  window.__ekDailyTreasureMount=mount;
  window.__ekDailyTreasureSync=syncFromApp;
})();
</script>
