let busy=false;
async function go(){
 if(busy)return;const s=S();
 if(s.wins.length>=MAX)return toast(`All ${MAX} scratch cards used today. Come back tomorrow!`);
 if(s.pending){openOv();return;}
 busy=true;
 try{
  const ok=await showRewarded('scratchCard');if(!ok)return;
  const t=S();if(t.wins.length>=MAX)return;
  if(!t.pending){t.pending=roll();t.prepared=[0];recordChestAd('scratch');persist();}
  renderRoute();toast('Scratch card unlocked!','success');openOv();
 }catch(e){toast((e&&e.message)||'Ad not available. Try again.','error');}
 finally{busy=false;}
}
window.prepareScratchSurface=function(){return go();};
window.revealScratch=function(){
 const s=S();
 if(!s.pending){toast('Watch the ad first, then scratch.');return 0;}
 if(s.wins.length>=MAX){toast('Daily scratch limit reached.');return 0;}
 const amount=Math.min(CAP,s.pending),n=s.wins.length,win={index:n,level:0,amount,date:new Date().toISOString()};
 s.pending=0;s.prepared=[];s.count=(Number(s.count)||0)+1;s.wins.push(win);
 s.recent=[win,...(Array.isArray(s.recent)?s.recent:[])].slice(0,30);
 challengeProgress('scratch',1);credit(amount,`Scratch card #${n+1} reward`);persist();
 toast(`You won ${money(amount,3)} USDT!`,'success');renderRoute();return amount;
};

 function confetti(){const q=box.getBoundingClientRect(),cx=q.left+q.width/2,cy=q.top+q.height/2,cols=['#ffd24d','#ff5d8f','#7be0c3','#b98cff','#ffffff','#ffb02e'];for(let i=0;i<90;i++){const an=Math.random()*6.283,s=3+Math.random()*7;ps.push({x:cx,y:cy,vx:Math.cos(an)*s,vy:Math.sin(an)*s-4,g:.22,w:5+Math.random()*5,h:3+Math.random()*5,a:Math.random()*6,va:(Math.random()-.5)*.5,c:cols[i%6],life:1.5,dec:.011});}kick();}
 let down=false,last=null,fin=false,lastCheck=0,lastVib=0;
 const stamp=(x,y)=>{ctx.drawImage(br,x-R,y-R,R*2,R*2);mx.beginPath();mx.arc(x/K,y/K,R*.9/K,0,6.3);mx.fill();};
 const seg=(a,b)=>{const d=Math.hypot(b.x-a.x,b.y-a.y),n=Math.max(1,Math.ceil(d/(R*.3)));for(let i=1;i<=n;i++)stamp(a.x+(b.x-a.x)*i/n,a.y+(b.y-a.y)*i/n);if(!RM){const c=Math.min(3,1+((d/14)|0));for(let i=0;i<c;i++)flake(b.cx,b.cy);}
  const t=performance.now();if(t-lastVib>70){lastVib=t;try{navigator.vibrate&&navigator.vibrate(4);}catch(_){}}};
 const pos=e=>{const b=cv.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top,cx:e.clientX,cy:e.clientY};};
 const coverage=()=>{const d=mx.getImageData(0,0,mw,mh).data;let c=0;for(let i=3;i<d.length;i+=4)if(d[i]>100)c++;return c/(mw*mh);};
 const check=(force)=>{if(fin)return;const t=performance.now();if(!force&&t-lastCheck<90)return;lastCheck=t;const c=coverage();if(c>=.5)finish();else if(c>.3)hint.textContent='Almost there…';else if(c>.08)hint.textContent='Keep going…';};

  if(fin)return;fin=true;down=false;cv.style.transition='opacity .55s ease, transform .55s ease';cv.style.opacity='0';cv.style.transform='scale(1.04)';cv.style.pointerEvents='none';box.classList.add('won');
  try{navigator.vibrate&&navigator.vibrate([18,40,30]);}catch(_){}

},true);

};
