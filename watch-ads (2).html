(function(){

var TOTAL=0.035,LIMIT=13,PER=TOTAL/LIMIT;
function m4(x){return '$'+(Number(x)||0).toFixed(4)}
function arc(r,a0,a1){var p=function(a){return [(62+r*Math.cos(a)).toFixed(2),(62+r*Math.sin(a)).toFixed(2)]},s=p(a0),e=p(a1);return 'M'+s[0]+' '+s[1]+' A'+r+' '+r+' 0 0 1 '+e[0]+' '+e[1]}

 var step=2*Math.PI/LIMIT,gap=.16,segs='',i;
 for(i=0;i<LIMIT;i++){
  var a0=-Math.PI/2+i*step+gap/2,a1=-Math.PI/2+(i+1)*step-gap/2,cls=i<n?'on':(i===n?'next':'off');

 }
 return '<svg viewBox="0 0 124 124" aria-hidden="true"><defs><linearGradient id="wa3g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0b8"/><stop offset=".55" stop-color="#f3c566"/><stop offset="1" stop-color="#d4913a"/></linearGradient><radialGradient id="wa3d" cx=".35" cy=".25" r=".95"><stop offset="0" stop-color="#9b2a3f"/><stop offset=".6" stop-color="#5f1425"/><stop offset="1" stop-color="#3d0a17"/></radialGradient></defs>'
 +'<circle cx="62" cy="62" r="40" fill="url(#wa3d)" stroke="rgba(243,197,102,.7)" stroke-width="1.6"/><circle cx="62" cy="62" r="35.5" fill="none" stroke="rgba(243,197,102,.25)" stroke-width="1" stroke-dasharray="2 4"/>'+segs+'</svg>';
}
var I={

};
var prev=watchAdsView;

 try{k=Math.min(LIMIT,Number(ensureChestProgress().adCount)||0)}catch(e){}
 var left=LIMIT-n,done=left<=0;

  +'<div class="wa3-chips"><span>$'+TOTAL.toFixed(3)+' ÷ '+LIMIT+' ads</span><span><b>'+left+'</b> left today</span><span>Max <b>$'+TOTAL.toFixed(3)+'</b>/day</span></div></div>';
 var st='<div class="wa3-st">'

  +'<div class="wa3-tile"><span class="ic">'+I.hour+'</span><b>'+m4(left*PER)+'</b><small>Still available</small></div>'

  .replace(/Each completed ad pays \$0\.0026923 and adds one Lucky Chest key\./,'Each ad pays $'+PER.toFixed(4)+' and adds 1 Lucky Chest key.')
  .replace('Daily cap reached','All ads watched today');
 return h;

 else if(st==='cooldown')lab=f(L.cooldown,{s:Math.max(0,Math.ceil((S.cooldownEnd-Date.now())/1000))});
 else if(st==='done')lab=L.done;
 txt('btn',lab);
 var p=S.goal>0?Math.min(1,S.watched/S.goal):0;
 var off=(C*(1-p)).toFixed(2);
 K.ring.style.strokeDashoffset=off;K.ringGlow.style.strokeDashoffset=off;
 root.classList.toggle('is-loading',st==='loading');
 root.classList.toggle('is-cooldown',st==='cooldown');
 root.classList.toggle('is-done',st==='done');
 root.classList.toggle('is-unlocked',rem===0&&!S.chestOpened);
 K.watchBtn.setAttribute('aria-disabled',(st!=='idle')?'true':'false');
 K.chestBtn.setAttribute('data-locked',rem>0?'true':'false');
}
function setStatus(s){S.status=s;render();}

/* ---------- cooldown ---------- */
function startCooldown(sec){clearInterval(cdTimer);
 if(!(sec>0)){S.cooldownEnd=0;return false;}
 S.cooldownEnd=Date.now()+sec*1000;S.status='cooldown';render();emit('cooldown',{seconds:sec});
 cdTimer=setInterval(function(){
  if(Date.now()>=S.cooldownEnd){clearInterval(cdTimer);S.cooldownEnd=0;S.status=(S.watched>=S.goal)?'done':'idle';render();emit('cooldownEnd',{});}
  else render();},250);
 return true;}

/* ---------- particles / feedback ---------- */
function burst(cx,cy,n,withPlus){
 if(RM)return;var host=K.burst,P=pxs();
 var kinds=[
  {cls:'m-round',w:44,h:44,sx:80,sy:1036,css:''},

   {opacity:0,transform:'translate(0,0) scale(.3) rotate(0deg)'},
   {opacity:1,offset:.14,transform:'translate('+dx*.25+'px,'+(dy*.25-up*.4)+'px) scale('+sc+') rotate('+rot*.2+'deg)'},
   {opacity:1,offset:.55,transform:'translate('+dx*.7+'px,'+(dy*.5-up)+'px) scale('+sc+') rotate('+rot*.6+'deg)'},
   {opacity:0,transform:'translate('+dx+'px,'+(dy+120*P)+'px) scale('+sc*.8+') rotate('+rot+'deg)'}],
   {duration:900+Math.random()*500,easing:'cubic-bezier(.2,.7,.3,1)',delay:Math.random()*80});
  an.onfinish=(function(el){return function(){el.remove();};})(e);}
 if(withPlus){var pl=document.createElement('b');pl.className='plus';pl.textContent=withPlus;

  a2.onfinish=function(){pl.remove();};}}
function shake(els){if(RM)return;els.forEach(function(el){if(el&&el.animate)el.animate([{transform:'translateX(0)'},{transform:'translateX(-7px)'},{transform:'translateX(7px)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:420,easing:'ease-out'});});}

/* ---------- actions ---------- */
function watchAd(){
 if(S.status!=='idle')return Promise.resolve(false);
 errShown=false;clearTimeout(errTimer);
 setStatus('loading');
 var out=emit('watchAd',{index:S.watched+1,watched:S.watched,goal:S.goal,perAd:S.perAd});
 var p;
 if(out!==undefined)p=Promise.resolve(out);
 else if(cfg.demo)p=new Promise(function(res){setTimeout(function(){res({reward:S.perAd});},cfg.demoDelay);});
 else p=new Promise(function(res,rej){pending={res:res,rej:rej};});
 return p.then(complete,fail);}
function complete(r){
 pending=null;
 if(r===false){emit('adCancel',{});S.status='idle';render();return false;}
 r=(r&&typeof r==='object')?r:{};
 var reward=r.reward!=null?Number(r.reward):S.perAd;
 var before=remaining();
 S.watched=r.watched!=null?Math.min(S.goal,Number(r.watched)):Math.min(S.goal,S.watched+1);
 S.earned=r.earned!=null?Number(r.earned):r6(S.earned+reward);
 S.available=r.available!=null?Number(r.available):Math.max(0,r6(S.available-reward));
 if(r.goal!=null)S.goal=Number(r.goal);
 goLive();
 var done=S.watched>=S.goal;
 S.status=done?'done':'idle';render();
 burst(396,570,12,'+'+money(reward));
 var cd=r.cooldown!=null?Number(r.cooldown):(S.cooldownSec!=null?S.cooldownSec:(cfg.demo?cfg.demoCooldown:0));
 if(!done)startCooldown(cd);
 emit('adComplete',{reward:reward,watched:S.watched,goal:S.goal,earned:S.earned,available:S.available});
 if(done)emit('done',{watched:S.watched,goal:S.goal});
 if(before>0&&remaining()===0){setTimeout(function(){burst(170,990,10);emit('unlocked',{});},500);}
 return true;}
function fail(err){
 pending=null;S.status='idle';errShown=true;render();
 shake([K.btn]);emit('error',{message:(err&&err.message)||String(err||'error'),source:'watchAd'});
 clearTimeout(errTimer);errTimer=setTimeout(function(){errShown=false;render();},2200);return false;}
function openChest(){
 var rem=remaining();
 if(rem>0){emit('locked',{remaining:rem,watched:S.watched,goal:S.goal});shake([K.lucky,K.more]);return Promise.resolve(false);}
 if(S.chestOpened){emit('open',{opened:true});return Promise.resolve(true);}
 var out=emit('open',{watched:S.watched,goal:S.goal});
 return Promise.resolve(out===undefined?{}:out).then(function(r){
  S.chestOpened=true;goLive();render();burst(170,990,16,(r&&r.reward!=null)?('+'+money(r.reward)):null);emit('claim',{result:r||{}});return true;},
  function(err){emit('error',{message:(err&&err.message)||String(err||'error'),source:'open'});return false;});}

/* ---------- bounce on tap ---------- */
var BT={back:[26,42,84,84,42],watch:[16,512,689,115,57],earned:[22,646,216,214,36],available:[252,646,216,214,36],watched:[482,646,218,214,36],chest:[20,882,680,228,40]};
function bounce(key){
 if(RM||!BT[key])return;var b=BT[key],P=pxs(),ui=root.querySelector('.ui');
 var grp={watch:[K.btn],earned:[K.v1,K.l1],available:[K.v2,K.l2],watched:[K.v3,K.l3],chest:[K.lucky,K.more],back:[]}[key]||[];
 var kf=[{transform:'scale(1)'},{transform:'scale(.95)',offset:.22},{transform:'scale(1.035)',offset:.55},{transform:'scale(.99)',offset:.78},{transform:'scale(1)'}];
 var o={duration:520,easing:'cubic-bezier(.3,.7,.3,1)'};
 var c=document.createElement('i');c.className='pt';
 c.style.cssText='--x:'+b[0]+';--y:'+b[1]+';--w:'+b[2]+';--h:'+b[3]+';--sx:'+b[0]+';--sy:'+b[1]+';border-radius:'+(b[4]*P)+'px';
 ui.insertBefore(c,ui.firstChild);
 var a=c.animate(kf,o);a.onfinish=function(){c.remove();};
 grp.forEach(function(t){if(t&&t.animate)t.animate(kf,o);});}
/* ---------- elastic scroll (small up/down give, springs back) ---------- */
var EL={y:0,t0:0,on:false,wt:0},fxl=root.querySelector('.fxl');
function elY(v){EL.y=v;stage.style.transform='translate3d(0,'+v+'px,0)';if(fxl)fxl.style.transform='translate3d(0,'+(v*.45)+'px,0)';}
function elBack(){if(RM){elY(0);return;}var from=EL.y,P=pxs();if(!from)return;
 var a=stage.animate([{transform:'translate3d(0,'+from+'px,0)'},{transform:'translate3d(0,0,0)'}],{duration:620,easing:'cubic-bezier(.3,1.7,.5,1)'});
 if(fxl)fxl.animate([{transform:'translate3d(0,'+(from*.45)+'px,0)'},{transform:'translate3d(0,0,0)'}],{duration:760,easing:'cubic-bezier(.3,1.5,.5,1)'});
 elY(0);}
function lim(v){var m=16*pxs();return Math.max(-m,Math.min(m,v));}

root.addEventListener('wheel',function(e){elY(lim(EL.y-e.deltaY*.12));clearTimeout(EL.wt);EL.wt=setTimeout(elBack,140);},{passive:true});
/* ---------- input ---------- */
root.addEventListener('pointerdown',goLive,true);
root.addEventListener('keydown',goLive,true);
root.addEventListener('click',function(e){
 var b=e.target.closest&&e.target.closest('[data-act]');if(!b||!root.contains(b))return;
 var a=b.getAttribute('data-act');
 bounce(a==='stat'?b.getAttribute('data-id'):a);

 else if(a==='stat'){var id=b.getAttribute('data-id');emit('stat',{id:id,value:id==='earned'?S.earned:id==='available'?S.available:S.watched});}
 else if(a==='chest')openChest();});

/* ---------- public API ---------- */
var api={
 init:function(o){o=o||{};
  if(o.demo!=null)cfg.demo=!!o.demo;
  if(o.config)api.configure(o.config);
  if(o.labels)Object.keys(o.labels).forEach(function(k){L[k]=o.labels[k];});
  if(o.theme)theme(o.theme);
  if(o.data)patch(o.data);else render();
  emit('ready',{state:api.state});return api;},
 set:function(p){patch(p||{});return api;},
 on:function(ev,fn){(handlers[ev]=handlers[ev]||[]).push(fn);return api;},
 off:function(ev,fn){if(!fn)delete handlers[ev];else handlers[ev]=(handlers[ev]||[]).filter(function(x){return x!==fn;});return api;},
 hooks:hooks,
 configure:function(o){o=o||{};Object.keys(o).forEach(function(k){cfg[k]=o[k];});if('fit' in o)calibrate();return api;},
 exact:function(on){if(on===undefined)return !live;live=!on;root.classList.toggle('live',live);return !live;},
 watchAd:watchAd,openChest:openChest,
 resolve:function(r){if(pending)pending.res(r);else if(S.status==='loading')complete(r);return api;},
 fail:function(e){if(pending)pending.rej(e);else if(S.status==='loading')fail(e);return api;},
 reset:function(){clearInterval(cdTimer);S.watched=0;S.earned=0;S.available=r6(S.goal*S.perAd);S.status='idle';S.chestOpened=false;S.cooldownEnd=0;render();return api;},
 root:root};
Object.defineProperty(api,'state',{enumerable:true,get:function(){var o=JSON.parse(JSON.stringify(S));o.remaining=remaining();o.labels=JSON.parse(JSON.stringify(L));return Object.freeze(o);}});
function theme(t){Object.keys(t).forEach(function(k){root.style.setProperty('--c-'+k,t[k]);});}
function patch(p){var c=false;
 ['watched','goal','perAd','earned','available'].forEach(function(k){if(p[k]!=null&&isFinite(p[k])){S[k]=Number(p[k]);c=true;}});
 if(p.chestOpened!=null){S.chestOpened=!!p.chestOpened;c=true;}
 if(p.cooldownSec!=null)S.cooldownSec=Number(p.cooldownSec);
 if(p.user!==undefined)S.user=p.user;
 if(p.labels){Object.keys(p.labels).forEach(function(k){L[k]=p.labels[k];});c=true;}
 if(p.theme)theme(p.theme);
 if(p.cooldown!=null)startCooldown(Number(p.cooldown));
 if(S.watched>=S.goal&&S.status==='idle')S.status='done';
 else if(S.watched<S.goal&&S.status==='done')S.status='idle';
 if(c)goLive();render();}
window.addEventListener('message',function(e){var d=e.data;
 if(typeof d==='string'){try{d=JSON.parse(d);}catch(_){return;}}
 if(!d||typeof d!=='object')return;if(d.section&&d.section!==NAME)return;
 if(d.action==='set')api.set(d.patch||d.data||{});
 else if(d.action==='init')api.init(d.options||d);
 else if(d.action==='call'&&['watchAd','openChest','resolve','fail','exact','reset','configure'].indexOf(d.method)>-1)api[d.method].apply(api,d.args||[]);});
if('IntersectionObserver' in window){new IntersectionObserver(function(en){root.classList.toggle('wa-paused',!en[0].isIntersecting);},{threshold:0}).observe(root);}
window.WatchAds=api;
function boot(){calibrate();render();}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(boot);else boot();
window.addEventListener('resize',function(){sp=pxs();});

===== */

}
function snap(){
 try{ensureDaily('ads')}catch(e){}
 var n=0,k=0,earned=0,opened=false,ch;
 try{n=Math.min(LIMIT,Math.max(0,Number(state.ads&&state.ads.count)||0))}catch(e){}
 try{earned=Number(state.ads&&state.ads.rewardTotal);}catch(e){}
 if(!isFinite(earned)||earned<=0)earned=n*PER;
 earned=r6(earned);
 try{ch=ensureChestProgress();k=Math.min(LIMIT,Number(ch.adCount)||0);opened=!!ch.opened}catch(e){}
 return {n:n,earned:earned,available:Math.max(0,r6(TOTAL-earned)),k:k,opened:opened};
}
function chestLabels(s){
 var t=s.k>=LIMIT?'Your chest is ready to open':(LIMIT-s.k)+(LIMIT-s.k===1?' more ad to unlock':' more ads to unlock');

}

  },function(e){skip=false;throw e});
 });

}
