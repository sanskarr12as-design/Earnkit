<!--@@EK-BLOCK B616@@-->
<style id="ek-trading-cards-v48">
/* v48: Trading cards (Home + Earn) and Trading section shell */
html body #screenHost .ektrd-card{position:relative;display:flex;align-items:center;gap:12px;width:auto;margin:16px calc(3.8% + 12px) 18px;padding:13px 14px;border:1.5px solid #e2bc63;border-radius:22px;text-align:left;cursor:pointer;color:#fff3e4;overflow:hidden;-webkit-tap-highlight-color:transparent;
 background:radial-gradient(120% 140% at 0% 0%,#a3294a 0%,#7b1e3a 45%,#4a0f22 100%);
 box-shadow:0 10px 22px rgba(92,18,43,.30),inset 0 1px 0 rgba(255,255,255,.22);transition:transform .16s ease}
html body #screenHost .ektrd-card,html body #screenHost .st .ektrd-card.in{background:none!important;border:0!important;box-shadow:none!important;padding:0!important;gap:0!important;border-radius:0!important;overflow:visible!important}
html body #screenHost .ektrd-card img{display:block;width:100%;height:100%;object-fit:fill;pointer-events:none;-webkit-user-drag:none;user-select:none;filter:drop-shadow(0 6px 10px rgba(110,20,70,.28));transition:transform .16s ease}
html body #screenHost .ektrd-card:not(.in) img{height:auto}
html body #screenHost .ektrd-card:active img{transform:scale(.975)}
html body #screenHost .ektrd-card:active{transform:scale(.975)}
html body #screenHost .ektrd-card:focus-visible{outline:2px solid #f6d78e;outline-offset:3px}
html body #screenHost .ektrd-card .bgline{position:absolute;right:0;bottom:0;width:58%;height:100%;opacity:.28;pointer-events:none}
html body #screenHost .ektrd-card .ic{position:relative;flex:0 0 52px;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;
 background:linear-gradient(145deg,#fbe3a2,#d6a24d);box-shadow:0 4px 0 #a9782b,0 8px 14px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.6)}
html body #screenHost .ektrd-card .ic svg{width:30px;height:30px;display:block}
html body #screenHost .ektrd-card .tx{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
html body #screenHost .ektrd-card .tx b{font-size:16px;line-height:1.1;font-weight:900;letter-spacing:-.2px;color:#fff6e8}
html body #screenHost .ektrd-card .tx small{font-size:11px;line-height:1.3;font-weight:700;color:#f3d6c6;opacity:.92}
html body #screenHost .ektrd-card .go{position:relative;flex:0 0 32px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#fbe3a2,#d6a24d);color:#5a1428;box-shadow:0 3px 0 #a9782b}
html body #screenHost .ektrd-card .go svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
html body #screenHost .ektrd-card .tag{position:absolute;top:8px;right:12px;font-size:8px;font-weight:900;letter-spacing:1.2px;color:#f6d78e;opacity:.9}
/* Trading section */
html body #screenHost .ektrd-screen{padding:6px 14px 24px}
html body #screenHost .ektrd-screen .ektrd-head{padding:6px 2px 14px}
html body #screenHost .ektrd-screen .ektrd-kick{font-size:10px;font-weight:900;letter-spacing:1.6px;color:#8a1f3d}
html body #screenHost .ektrd-screen h1{margin:6px 0 6px;font-size:28px;font-weight:900;letter-spacing:-.8px;color:#5a1428}
html body #screenHost .ektrd-screen .ektrd-sub{margin:0;font-size:12px;font-weight:700;color:#7a5a60}
html body #screenHost .ektrd-screen .ektrd-mount{min-height:220px;border:1.5px dashed rgba(123,30,58,.35);border-radius:22px;background:rgba(255,250,241,.7);display:grid;place-items:center;text-align:center;padding:26px 18px}
html body #screenHost .ektrd-screen .ektrd-mount b{display:block;font-size:15px;color:#5a1428;margin-bottom:6px}
html body #screenHost .ektrd-screen .ektrd-mount span{font-size:11px;color:#7a5a60;font-weight:700}
</style>
<!--@@EK-BLOCK B618@@-->
<style id="ek-trading-cards-v53">
html body #screenHost .ektrd-slot{position:relative;display:block;width:100%;padding:8px 0 10px;box-sizing:border-box;background-repeat:no-repeat;background-size:100% 100%}
html body #screenHost .ektrd-slot.h{background-image:linear-gradient(90deg,rgb(160,110,103) 0%,rgb(107,115,49) 11%,rgb(178,148,100) 22%,rgb(163,95,90) 33%,rgb(184,127,108) 44%,rgb(211,164,126) 56%,rgb(148,104,79) 67%,rgb(122,123,49) 78%,rgb(94,118,32) 89%,rgb(174,116,124) 100%)}
html body #screenHost .ektrd-slot.e{background-image:linear-gradient(90deg,#fcc5c6,#fccbdc,#fcd6d6,#fcd5cc,#fcc8d3,#fdd3cd,#fcd4db,#fcbae4,#fba6dd)}
html body #screenHost .ektrd-slot .ektrd-card{margin:0 auto;width:calc(100% - 32px)}
</style>

function slot(kind){return '<div class="ektrd-slot '+(kind==='home'?'h':'e')+'">'+card()+'</div>';}
function applyStage(st,key){
  var host=st&&st.closest&&st.closest(key==='home'?'.EH':'.CH');if(!host||!host.parentNode)return false;
  var n=host.nextElementSibling;
  if(n&&n.classList&&n.classList.contains('ektrd-slot'))return false;
  var d=document.createElement('div');d.innerHTML=slot(key);host.parentNode.insertBefore(d.firstChild,host.nextSibling);

}

function inject(h,kind){
  if(typeof h!=='string'||h.indexOf('ektrd-card')>-1||kind!=='home')return h;
  try{
    var t=document.createElement('div');t.innerHTML=h;
    var st=t.querySelector('section.screen .EH .st');
    if(st&&applyStage(st,'home'))return t.innerHTML;
  }catch(e){}
  return h;
}
function wrap(name,kind){
  try{
    var base=window[name];if(typeof base!=='function')return;
    var nv=function(){return inject(base.apply(this,arguments),kind)};
    window[name]=nv;
    try{ if(name==='homeView')homeView=nv; else earnView=nv; }catch(e){}

}

}
