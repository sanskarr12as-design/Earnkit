function ekNewMilestonePanel(kind){
  const p=Math.max(0,Number(state.milestones?.progress?.[kind])||0),targets=[10,30,60,100];
  return `<section class="ek-milestone-panel ek-spin-redesign-section"><div class="ek-milestone-head"><div><h3>${kind==='spin'?'Spin wheel milestones':'Scratch card milestones'}</h3><p>Successful activity unlocks the linked milestone. Opening a partner link does not add wallet credit.</p></div><span class="badge">${p} progress</span></div><div class="progress"><i style="--progress:${Math.min(100,p)}%"></i></div><div class="ek-milestone-grid" style="margin-top:10px">${targets.map(t=>{const id=`${kind}:${t}`,claimed=(state.milestones?.claimed||[]).includes(id),ready=p>=t&&!claimed;return `<div class="ek-milestone-item ${claimed?'claimed':ready?'ready':''}"><div><b>${claimed?'✓ ':''}${t} ${kind==='spin'?'spin':'scratch'} milestone</b><small>${claimed?'Link already opened':ready?'Target reached · link ready':`${Math.max(0,t-p)} more to reach target`}</small></div><button class="btn ${ready?'':'secondary'}" data-action="claim-milestone" data-prefix="${kind}" data-target="${t}" data-amount="${t}" ${ready?'':'disabled'}>${claimed?'Opened':ready?'Open link ↗':'Locked'}</button></div>`}).join('')}</div></section>`;
}
spinView = function(){
  ensureDaily('spin');
  const available=Math.max(0,Number(state.spin.count)||0),batch=Math.max(1,Math.min(5,Number(state.spin.batch)||1));
  const history=Array.isArray(state.spin.history)?state.spin.history.slice(0,4):[];

spinView=function(){
 ensureDaily('spin');normalizeSpinDaily();ensureRef();normalizeSpinDaily();
 const cnt=Math.max(0,Number(state.spin.count)||0),ads=Math.max(0,Number(state.spin.bonusCount)||0),used=Math.max(0,Number(state.spin.playedToday)||0);
 const sp=[[22,36,1.2],[336,42,1.1],[308,120,1.8],[70,200,1],[345,218,1.1],[18,310,.9],[334,340,1],[26,430,1.3],[338,450,1.2],[92,540,.8],[310,570,.8]].map(p=>`<g transform="translate(${p[0]} ${p[1]}) scale(${p[2]})"><use href="#rfs"/></g>`).join('');
 const bg=`<svg viewBox="0 0 360 780" preserveAspectRatio="xMidYMin slice"><defs><path id="rfs" fill="#dcae4c" opacity=".6" d="M0-10C1.4-3.6 3.6-1.4 10 0 3.6 1.4 1.4 3.6 0 10-1.4 3.6-3.6 1.4-10 0-3.6-1.4-1.4-3.6 0-10z"/><path id="rff" d="M8 262C-14 226-6 176 24 150 22 182 34 202 58 214 42 218 26 232 20 252 34 238 48 236 60 240 40 252 24 262 8 262z"/></defs><g fill="#d4a548" opacity=".6"><use href="#rff"/><use href="#rff" transform="translate(360 0) scale(-1 1)"/><use href="#rff" transform="translate(0 330)"/><use href="#rff" transform="translate(360 330) scale(-1 1)"/></g>${sp}</svg>`;
 const row=(ic,t,sub,right)=>`<div class="rf-row"><span class="rf-ic">${ic}</span><div class="rf-tx"><b>${t}</b><small>${sub}</small><em>${I.wheel}+1</em></div>${right}</div>`;
 return `<section class="screen active rf-screen" data-screen="spin">

 <div class="rf-head"><div class="rf-title"><div class="rf-h1">SPIN WHEEL</div><p>Spin and win rewards!</p><i class="rf-rule"><u></u>${RFSTAR}<u></u></i></div><span class="sp-chip rf-chip">${I.wheel}<b data-sp-count>${cnt}</b> spin${cnt===1?'':'s'}</span></div>

function upd(){const c=Math.max(0,Number(state.spin.count)||0);document.querySelectorAll('[data-sp-count]').forEach(e=>e.textContent=c);document.querySelectorAll('[data-sp-used]').forEach(e=>e.textContent=Math.max(0,Number(state.spin.playedToday)||0));document.querySelectorAll('.sp-spin,.sp-auto').forEach(b=>b.classList.toggle('off',!c||Number(state.spin.playedToday||0)>=MAXSPIN));document.querySelectorAll('.sp-stage').forEach(e=>e.classList.toggle('ready',c>0&&Number(state.spin.playedToday||0)<MAXSPIN));const ch=document.querySelector('.sp-chip');if(ch){ch.lastChild.textContent=c===1?' spin':' spins';}}
function animateWheel(w,from,to,dur,auto){return new Promise(res=>{
 if(!w||REDUCED){if(w){w.style.transition='none';w.style.transform=`rotate(${to}deg)`;}return res();}
 const pin=document.querySelector('.sp-pin'),pull=auto?0:-12,pt1=auto?0:380,over=auto?0:2.4,st=auto?0:460,total=pt1+dur+st,A=from+pull,B=to+over;

 function f(now){
  if(!t0){t0=now;pl=now;}
  const t=now-t0,a=at(Math.min(t,total)),dt=Math.min(.034,(now-pl)/1000)||.016;pl=now;

<script id="ek-spinwheel-earnkit-bridge">

(function(){
  'use strict';
  if(window.__EKSpinWheelReplacement)return;
  window.__EKSpinWheelReplacement=true;
  var root=document.getElementById('spinwheel-root');
  var staging=document.getElementById('ekSpinSourceStaging');
  if(!root||!staging||!window.SpinWheel){console.error('EarnKit supplied SpinWheel could not initialize.');return;}
  window.__ekSpinWheelSourceRoot=root;
  var cache=document.createDocumentFragment();
  var mainEl=document.getElementById('mainArea')||document.querySelector('main.main');
  var savedMainPadding=mainEl?{left:mainEl.style.paddingLeft,right:mainEl.style.paddingRight}:null;
  function setFullBleed(on){
    if(!mainEl||!savedMainPadding)return;
    if(on){mainEl.style.setProperty('padding-left','0px','important');mainEl.style.setProperty('padding-right','0px','important');}
    else{mainEl.style.removeProperty('padding-left');mainEl.style.removeProperty('padding-right');}
  }
  var currentEntry=null;
  var resultSequence=0;
  var MAX_SPINS=16,MAX_ADS=16;
  function safeNumber(v){var n=Number(v);return Number.isFinite(n)?n:0;}
  function toastMsg(msg,type){try{if(typeof toast==='function')toast(msg,type||'error');}catch(e){}}
  function normalize(){
    try{if(typeof ensureDaily==='function')ensureDaily('spin');}catch(e){}
    try{if(typeof normalizeSpinDaily==='function')normalizeSpinDaily();}catch(e){}
    state.spin=state.spin&&typeof state.spin==='object'?state.spin:{date:'',count:1,total:0};
    state.spin.count=Math.max(0,Math.min(MAX_SPINS-(safeNumber(state.spin.playedToday)),safeNumber(state.spin.count)));
    state.spin.bonusCount=Math.max(0,Math.min(MAX_ADS,safeNumber(state.spin.bonusCount)));
    state.spin.total=Math.max(0,safeNumber(state.spin.total));
    state.spin.playedToday=Math.max(0,Math.min(MAX_SPINS,safeNumber(state.spin.playedToday)));
    state.spin.history=Array.isArray(state.spin.history)?state.spin.history:[];
  }
  function syncFromEarnKit(){
    normalize();
    window.SpinWheel.set({
      spins:state.spin.count,
      adsWatched:state.spin.bonusCount,
      adsMax:MAX_ADS
    });
  }
  function recordCompletedSpin(p){
    normalize();
    var idx=((Math.floor(safeNumber(p&&p.index))%8)+8)%8;
    var amount=Math.max(0,Math.round(safeNumber(p&&p.reward)*1e6)/1e6);
    state.spin.count=Math.max(0,Math.min(MAX_SPINS-safeNumber(state.spin.playedToday),safeNumber(p&&p.spins)));
    state.spin.total+=1;
    state.spin.playedToday=Math.min(MAX_SPINS,state.spin.playedToday+1);
    resultSequence+=1;
    currentEntry={
      id:'SW'+Date.now().toString(36).toUpperCase()+resultSequence.toString(36).toUpperCase(),
      idx:idx,amount:amount,bonus:false,date:new Date().toISOString(),
      claimed:amount<=0,source:'supplied-spin-wheel'
    };
    state.spin.history.unshift(currentEntry);
    state.spin.history=state.spin.history.slice(0,60);
    try{if(typeof challengeProgress==='function')challengeProgress('spin',1);}catch(e){console.warn('Spin challenge progress:',e);}
    try{if(typeof persist==='function')persist();}catch(e){console.warn('Spin state persist:',e);}
  }

  /* The supplied wheel chooses the index and runs its complete original animation.
     EarnKit supplies the current ticket balance and settles the selected source value. */
  window.SpinWheel.on('spin',function(){
    normalize();
    var played=state.spin.playedToday,available=state.spin.count;
    if(available<=0||played>=MAX_SPINS){
      toastMsg('No spins left today.');
      return {index:3,reward:0,spins:0};
    }
    var segments=window.SpinWheel.state.segments||[];
    if(segments.length!==8)segments=[0.0001,0.0002,0.0003,0,0.0001,0.0002,0.0003,0];
    var index=Math.floor(Math.random()*8);
    return {index:index,reward:Math.max(0,safeNumber(segments[index])),spins:Math.max(0,available-1)};
  });
  window.SpinWheel.on('result',function(p){recordCompletedSpin(p||{});});
  window.SpinWheel.on('claim',function(p){
    normalize();
    var amount=Math.max(0,Math.round(safeNumber(p&&p.reward)*1e6)/1e6);
    if(!currentEntry||currentEntry.claimed||amount<=0)return {ok:false,message:'This spin reward was already processed.'};
    if(Math.abs(amount-currentEntry.amount)>0.000001)return {ok:false,message:'Spin reward did not match the result.'};
    try{
      if(typeof credit!=='function')throw new Error('Wallet credit function is unavailable.');
      credit(amount,'Spin wheel reward');
      currentEntry.claimed=true;
      currentEntry.credited=true;
      if(typeof persist==='function')persist();
      return {ok:true,credited:amount};
    }catch(e){
      console.error('Spin reward credit failed:',e);
      return {ok:false,message:e&&e.message||'Reward credit failed.'};
    }
  });
  window.SpinWheel.on('miss',function(){
    if(currentEntry&&!currentEntry.claimed){currentEntry.claimed=true;currentEntry.missed=true;try{persist();}catch(e){}}
  });
  window.SpinWheel.on('watchAd',async function(){
    normalize();
    if(state.spin.playedToday>=MAX_SPINS||state.spin.count>=MAX_SPINS-state.spin.playedToday){
      toastMsg('Daily spin limit reached (16/16).');return {ok:false,message:'Daily spin limit reached.'};
    }
    if(state.spin.bonusCount>=MAX_ADS){toastMsg('Daily ad limit reached (16/16).');return {ok:false,message:'Daily ad limit reached.'};}
    try{
      if(typeof showRewarded!=='function')throw new Error('Rewarded ad provider is unavailable.');
      var confirmed=await showRewarded('spinBonus');
      if(!confirmed)return {ok:false,message:'Ad was not completed.'};
      normalize();
      if(state.spin.playedToday>=MAX_SPINS||state.spin.count>=MAX_SPINS-state.spin.playedToday)return {ok:false,message:'Daily spin limit reached.'};
      state.spin.bonusCount=Math.min(MAX_ADS,state.spin.bonusCount+1);
      state.spin.count=Math.min(MAX_SPINS-state.spin.playedToday,state.spin.count+1);
      try{if(typeof recordChestAd==='function')recordChestAd('spin');}catch(e){console.warn('Spin chest progress:',e);}
      if(typeof persist==='function')persist();
      syncFromEarnKit();
      toastMsg('+1 spin added','success');
      return {ok:true,adsWatched:state.spin.bonusCount,spins:state.spin.count};
    }catch(e){
      toastMsg(e&&e.message||'Ad not available. Try again.');
      return {ok:false,message:e&&e.message||'Ad not available.'};
    }
  });
  window.SpinWheel.on('open',function(p){
    var target=p&&p.target;
    if(target==='tasks'&&typeof go==='function')go('tasks');
    else if(target==='invite'&&typeof go==='function')go('referral');
  });
  window.SpinWheel.on('balance',function(){
    normalize();toastMsg(state.spin.count+' spins available.','success');
  });
  window.SpinWheel.on('error',function(p){toastMsg(p&&p.message||'Spin could not be completed.');});

  function restoreSourceArtwork(){
    var exactLayer=root.querySelector('.s-exact');
    if(exactLayer)exactLayer.style.setProperty('transition','none','important');
    if(typeof window.SpinWheel.exact==='function')window.SpinWheel.exact(true);
    return exactLayer;
  }
  function releaseArtworkTransition(exactLayer){
    if(!exactLayer)return;
    requestAnimationFrame(function(){requestAnimationFrame(function(){exactLayer.style.removeProperty('transition');})});
  }
  window.SpinWheel.init({demo:false});
  syncFromEarnKit();
  /* Standalone source opens in exact-art mode. Keep it that way at first
     mount; the source's own goLive() still runs on a real user interaction. */
  restoreSourceArtwork();

  /* Keep the section tap zones in sync with EarnKit tickets before source handlers run. */
  document.addEventListener('click',function(e){
    var hit=e.target&&e.target.closest?e.target.closest('#spinwheel-root .hit[data-act="spin"],#spinwheel-root .hit[data-act="auto"]'):null;
    if(!hit)return;
    normalize();
    if(state.spin.count<=0||state.spin.playedToday>=MAX_SPINS){
      e.preventDefault();e.stopImmediatePropagation();toastMsg('No spins left today. Watch an ad to add one.');return;
    }
    syncFromEarnKit();
  },true);

  /* The supplied section is the only Spin route UI. Preserve it across route swaps. */
  spinView=function(){
    normalize();
    return '<section class="screen active" data-screen="spin"><div id="ekSpinWheelMount"></div></section>';
  };
  var previousRenderRoute=renderRoute;
  renderRoute=function(){
    var liveRoot=document.getElementById('spinwheel-root');
    if(liveRoot&&liveRoot.parentNode)cache.appendChild(liveRoot);
    var result=previousRenderRoute.apply(this,arguments);
    var isSpin=typeof currentRoute!=='undefined'&&currentRoute==='spin';
    setFullBleed(isSpin);
    if(isSpin){
      var mount=document.getElementById('ekSpinWheelMount');
      if(mount){
        /* Sync and restore while detached. Disable only the art cross-fade for
           the mount frame; original wheel, bulb, glow and click animations stay
           untouched. The original cross-fade is restored immediately after. */
        syncFromEarnKit();
        var exactLayer=restoreSourceArtwork();
        mount.appendChild(root);
        releaseArtworkTransition(exactLayer);
      }
    }
    return result;
  };
  try{if(typeof currentRoute!=='undefined'&&currentRoute==='spin')renderRoute();}catch(e){console.warn('Initial SpinWheel route render:',e);}
})();

</script>
