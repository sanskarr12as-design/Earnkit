.lb .lst{--s:calc(100cqw / 860);position:relative}
@supports not (width:1cqw){.lb .lst{--s:calc(min(100vw,430px) / 860)}}
.lb .hd,.lb .rw,.lb .ft{position:relative;width:100%;background-image:var(--src1);background-repeat:no-repeat;background-size:calc(860 * var(--s)) auto}
.lb .hd{height:calc(179 * var(--s))}
.lb .rw{height:calc(128 * var(--s));background-position:0 calc(-1 * var(--by) * var(--s));cursor:pointer;contain:layout paint style;-webkit-tap-highlight-color:transparent;opacity:0;transition:transform .4s cubic-bezier(.34,1.56,.64,1),filter .2s}
.lb .rw.in{opacity:1;animation:lbrow .6s cubic-bezier(.22,1,.36,1) var(--dl,0ms) backwards}
@keyframes lbrow{from{opacity:0;transform:translate3d(0,calc(16 * var(--s)),0)}}
.lb .rw:active{transform:scale(.985);filter:brightness(.97);transition-duration:.1s}
.lb .ft{height:calc(111 * var(--s));background-position:0 calc(-1331 * var(--s))}
.lb .lst .it{opacity:1}
.lb .it{position:absolute;display:flex;align-items:center;opacity:0;transition:opacity .4s ease;transform-origin:50% 50%;box-sizing:border-box;white-space:nowrap;overflow:hidden;line-height:1;font-variant-numeric:lining-nums;pointer-events:none}
.lb.live .it{opacity:1}.lb .it.pop{animation:lbpop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes lbpop{0%{transform:scale(.88)}55%{transform:scale(1.07)}100%{transform:none}}.lb .it.wrap{white-space:normal;line-height:1.18}
.lb .zone{position:absolute;cursor:pointer;overflow:hidden;transition:transform .4s cubic-bezier(.34,1.56,.64,1),background-color .25s;outline:none}
.lb .zone:active{transform:scale(.97);transition-duration:.1s}
@media (hover:hover){.lb .zone:hover{background:rgba(255,255,255,.07)}}
.lb .rp{position:absolute;width:calc(20 * var(--s));height:calc(20 * var(--s));margin:calc(-10 * var(--s)) 0 0 calc(-10 * var(--s));border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.6),rgba(255,255,255,0) 70%);transform:scale(0);animation:lbrp .65s cubic-bezier(.22,1,.36,1) forwards;pointer-events:none}
@keyframes lbrp{to{transform:scale(var(--k));opacity:0}}.lb .zone:focus-visible{box-shadow:0 0 0 2px #fff,0 0 0 4px #c2185b}
.lb .zone.loading{opacity:.7;pointer-events:none}.lb .zone.err{animation:lbshake .4s}
@keyframes lbshake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.lb.paused *,.lb.paused .pt:before{animation-play-state:paused}
.lb .pt{position:absolute;top:-6%;left:var(--x);width:calc(var(--z) * var(--s));height:calc(var(--z) * var(--s));opacity:0;will-change:transform,opacity;animation:lbfall var(--d) linear var(--l) infinite;pointer-events:none}
.lb .pt:before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;border-radius:70% 0 70% 0;background:linear-gradient(135deg,#ffd6e2,#f58cb0);will-change:transform;animation:lbsway var(--w) ease-in-out var(--l) infinite alternate}

(function(){

  var lbRoot=document.getElementById('lb');
  var scRoot=document.getElementById('sc');

  if(!lbRoot||!scRoot||!staging||!window.Leaderboard||!window.ScratchCard){
    console.error('EarnKit Leaderboard/Scratch source stage could not initialize.');
    return;

  cache.appendChild(lbRoot);cache.appendChild(scRoot);

  function safeMoney(v,dp){return '$'+(Number(v)||0).toFixed(dp==null?2:dp);}

  function syncLeaderboard(force){

      var total=Math.max(0,Number(state.previewEarnedBackup!=null?state.previewEarnedBackup:state.totalEarned)||0);
      if(force||lastLbTotal===null||Math.abs(total-lastLbTotal)>0.0000001){

        .filter(function(m){return (Number(m&&m.amount)||0)>=(typeof LB_MIN_EARNED!=='undefined'?LB_MIN_EARNED:0.01)})
        .slice().sort(function(a,b){return (Number(b.amount)||0)-(Number(a.amount)||0)}).slice(0,30);
      var myId=String((typeof LB!=='undefined'&&LB.localPlayerId)|| (typeof lbSelfId==='function'?lbSelfId():'') || '');

        var ix=all.findIndex(function(m){return String(m.uid||'')===myId;});
        if(myAmount>=0.01&&ix>=0)rank=ix+1;

    var title=rank?'Leaderboard · Rank #'+rank:'Leaderboard member';
    var prize=u.prize||'';
    var body='<div class="card"><div class="kicker">All-time account</div><h2>'+esc(u.id||'Member')+'</h2><p>Recorded earnings: <b>'+esc(u.amount||'$0.00')+'</b></p>'+(prize?'<p>Prize position: <b>'+esc(prize)+'</b></p>':'')+'</div>';
    showModal(title,body);
  }

  window.Leaderboard.init({demo:false});
  window.ScratchCard.init({demo:false});

  window.Leaderboard.on('top30',function(){scrollToSource('leaderboard');});
  window.Leaderboard.on('play',function(){scrollToSource('leaderboard');});
  window.Leaderboard.on('period',function(){if(typeof toast==='function')toast('All-time leaderboard is shown.');});
  window.Leaderboard.on('stat',function(p){
    var k=p&&p.k,labels={rank:'Your current rank',total:'Your all-time earned total',qualified:'Eligible leaderboard entries'};
    var val=k==='rank'?window.Leaderboard.state.rank:k==='total'?window.Leaderboard.state.total:window.Leaderboard.state.qual;
    showModal(labels[k]||'Leaderboard details','<div class="card"><h2>'+esc(val||'—')+'</h2><p>'+(k==='rank'?'You need at least $0.01 in recorded earnings to qualify.':k==='total'?'This value is taken from your existing EarnKit total-earned balance.':'The top 30 eligible entries are displayed.')+'</p></div>');
  });
  window.Leaderboard.on('rewards',function(){
    var prizes=typeof LB_REWARDS!=='undefined'?LB_REWARDS:{1:10,2:5,3:2};
    showModal('All-time leaderboard rewards','<div class="card"><div class="amount-line"><span>Rank #1</span><b>$'+Number(prizes[1]||0).toFixed(2)+'</b></div><div class="amount-line"><span>Rank #2</span><b>$'+Number(prizes[2]||0).toFixed(2)+'</b></div><div class="amount-line"><span>Rank #3</span><b>$'+Number(prizes[3]||0).toFixed(2)+'</b></div><p class="small muted">This screen displays the configured prize amounts; it does not automatically credit a prize.</p></div>');
  });
  window.Leaderboard.on('user',showUserDetails);

  function startExistingScratchFlow(){
    if(typeof window.prepareScratchSurface!=='function'){
      if(typeof toast==='function')toast('Scratch reward system is unavailable.','error');
      return false;
    }
    var result=window.prepareScratchSurface();
    if(result&&typeof result.then==='function')return result.then(function(v){syncScratch();return v;});
    syncScratch();return result;
  }
  function openScratchLevel(p){
    var level=Number(p&&p.level||0);
    if(level===0)return startExistingScratchFlow();
    if(typeof toast==='function')toast('Level '+(level+1)+' is locked.');
    return false;
  }
  window.ScratchCard.on('getCard',startExistingScratchFlow);
  window.ScratchCard.on('openLevel',openScratchLevel);
  window.ScratchCard.on('level',openScratchLevel);
  window.ScratchCard.on('moreRewards',function(){
    var z=scRoot.querySelector('.zone[aria-label="openLevel"]');
    if(z)z.scrollIntoView({behavior:'smooth',block:'center'});
  });
  window.ScratchCard.on('viewWins',function(){
    var wins=Array.isArray(state.scratch&&state.scratch.wins)?state.scratch.wins.slice().reverse():[];
    var body=wins.length?'<div class="card">'+wins.slice(0,16).map(function(w,i){
      return '<div class="amount-line"><span>Scratch card #'+(Number(w.index!=null?w.index:i)+1)+'</span><b class="inline-reward">'+esc(safeMoney(w.amount,3))+'</b></div>';
    }).join('')+'</div>':'<div class="empty-state"><div class="emoji">✦</div><h3>No scratch wins yet</h3><p>Complete a confirmed rewarded ad and scratch the card to reveal a reward.</p></div>';
    showModal('Recent scratch wins',body);
  });
  window.ScratchCard.on('empty',function(){if(typeof toast==='function')toast('All 16 scratch cards have been used today.');});
  window.ScratchCard.on('locked',function(p){if(typeof toast==='function')toast('Level '+(Number(p&&p.level||0)+1)+' is locked.');});
  window.ScratchCard.on('error',function(p){if(typeof toast==='function')toast((p&&p.error)||'Scratch action could not be completed.','error');});

  /* Replace only the two route views; the rest of EarnKit keeps its own renderers. */
  leaderboardView=function(){return '<section class="screen active" data-screen="leaderboard"><div id="ekLeaderboardPageMount"></div></section>';};
  scratchView=function(){return '<section class="screen active" data-screen="scratch"><div id="ekScratchPageMount"></div></section>';};

  var baseRenderRoute=renderRoute;
  renderRoute=function(){
    var oldLb=document.getElementById('lb');
    var oldSc=document.getElementById('sc');
    if(oldLb&&oldLb.parentNode)cache.appendChild(oldLb);
    if(oldSc&&oldSc.parentNode)cache.appendChild(oldSc);
    var result=baseRenderRoute.apply(this,arguments);
    if(typeof currentRoute!=='undefined'&&currentRoute==='leaderboard'){
      var lbMount=document.getElementById('ekLeaderboardPageMount');
      if(lbMount){lbMount.appendChild(lbRoot);syncLeaderboard(false);}
    }else if(typeof currentRoute!=='undefined'&&currentRoute==='scratch'){
      var scMount=document.getElementById('ekScratchPageMount');
      if(scMount){scMount.appendChild(scRoot);syncScratch();}
    }
    return result;
  };

  syncLeaderboard(true);syncScratch();
  try{if(typeof currentRoute!=='undefined'&&(currentRoute==='leaderboard'||currentRoute==='scratch'))renderRoute();}catch(e){console.warn('Initial leaderboard/scratch render:',e);}
})();
</script>
