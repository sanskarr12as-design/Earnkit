        mutationObserver.observe(d.documentElement,{subtree:true,childList:true,attributes:true,characterData:true});
      }
      d.addEventListener('click',function(){requestAnimationFrame(fitFrame)},true);
      d.defaultView.addEventListener('resize',fitFrame,{passive:true});
      fitFrame(); requestAnimationFrame(fitFrame); setTimeout(fitFrame,250); setTimeout(fitFrame,650);
    }catch(e){}
  }
  frame.addEventListener('load',function(){didLoad=true;watchFrame();});

  function view(){
    return '<section class="screen active" data-screen="bounty"><div id="ekVideoEarnMount"></div></section>';
  }
  window.EKRoutes = window.EKRoutes || {};
  window.EKRoutes.bounty = view;
  window.EKRoutes.bountySubmit = view;

  var previousRender = window.renderRoute;
  if(typeof previousRender !== 'function') return;
  window.renderRoute = function(){
    var route = (typeof currentRoute !== 'undefined' && currentRoute) || '';
    var videoRoute = route === 'bounty' || route === 'bountySubmit';
    if(!videoRoute && frame.parentNode !== parking) parking.appendChild(frame);
    var result = previousRender.apply(this,arguments);
    if(videoRoute){
      var mount = host.querySelector('#ekVideoEarnMount');
      if(mount && frame.parentNode !== mount) mount.appendChild(frame);
      if(!frame.srcdoc) frame.srcdoc = standaloneHTML;
      else if(didLoad) requestAnimationFrame(fitFrame);
    }
    return result;
  };
  window.addEventListener('resize',fitFrame,{passive:true});
})();</script>
