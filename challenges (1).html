function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function f2(x){return (Number(x)||0).toFixed(2)}
var ORDER=[['spin','spin','Spin Wheel'],['scratch','scratch','Scratch Card'],['ads','ads','Watch Ads'],['referral','refer','Referrals']];
function view(){
  var T=challengesData(),cl=(state.challenges&&state.challenges.claimed)||[],lv=challengeLevelTotal(),pool=0,got=0,dn=0,info={};
  T.forEach(function(c){
    var p=challengeProgressValue(c.key),maxReq=challengeMaxRequirement(c),done=0,ready=0;
    pool+=c.total;
    c.items.forEach(function(r,i){var id=c.key+':'+(i+1);if(cl.indexOf(id)>=0){got+=r;dn++;done++;}else if(p>=challengeRequirement(c,i))ready++;});
    info[c.key]={c:c,p:Math.min(p,maxReq),max:maxReq,ready:ready};
  });
  var pc=lv?Math.max(dn?3:0,dn/lv*100):0;
  var h='<section class="screen active ch10" data-screen="challenges" aria-hidden="false">';
  h+='<div class="ch10-banner"><img src="'+IMG.banner+'" alt="All Challenges. Complete challenges, earn rewards and level up your journey!" draggable="false">'
    +'<button type="button" class="ch10-back" onclick="back()" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="#5a3f93" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button></div>';
  h+='<div class="ch10-prog"><img src="'+IMG.prog+'" alt="" draggable="false">'
    +'<span class="ch10-t ch10-lbl" style="top:25.5%">Levels claimed</span>'
    +'<span class="ch10-t ch10-big">'+dn+'<small>/'+lv+'</small></span>'
    +'<span class="ch10-t ch10-lbl r" style="top:25.5%">Your Progress</span>'
    +'<span class="ch10-t ch10-gold">'+f2(pool)+' USDT</span>'
    +'<span class="ch10-t ch10-cl">$'+f2(got)+' claimed</span>'
    +'<div class="ch10-bar"><i style="width:'+pc.toFixed(2)+'%"></i></div></div>';
  h+='<div class="ch10-grid">';
  ORDER.forEach(function(o){
    var k=info[o[0]];if(!k)return;var c=k.c;
    var chip=k.ready?'<span class="ch10-chip rdy">'+k.ready+' ready to claim</span>':'<span class="ch10-chip">'+k.p+'/'+k.max+' '+esc(c.unit)+'</span>';
    h+='<button type="button" class="ch10-card" data-go="'+esc(c.route)+'" aria-label="'+esc(c.name)+': '+c.items.length+' levels, '+f2(c.total)+' USDT"><img src="'+IMG[o[1]]+'" alt="" draggable="false">'
      +'<span class="ch10-info"><span class="ch10-ttl">'+o[2]+'</span><span class="ch10-rw">'+f2(c.total)+' <em>USDT</em></span>'+chip+'</span></button>';
  });
  return h+'</div><i class="screen-detail" hidden></i></section>';
}
try{challengesView=view;}catch(e){console.error('ch10',e);}
try{window.EKRoutes=window.EKRoutes||{};window.EKRoutes.challenges=view;}catch(e){}
