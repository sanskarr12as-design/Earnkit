.pfx-back{position:relative;z-index:2;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.85);background:linear-gradient(145deg,#fff8f2,#fbe9df);color:#5a0e26;box-shadow:0 6px 16px rgba(140,60,60,.14),inset 0 1px 0 #fff}

.pfx-head h1{position:relative;display:inline-block;margin:4px 0 0;padding-bottom:12px;font:800 clamp(46px,13.5vw,60px)/1.02 'Playfair Display',Georgia,serif;letter-spacing:-1.8px;color:#5a0a25;background:linear-gradient(180deg,#6d0f2c,#4a0720);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
