  api.on('openBest',function(p){if(typeof window.toast==='function')window.toast('Best score: '+(Number(p.best)||0));});
  api.on('openConverted',function(){if(typeof window.ekCloseGame==='function')window.ekCloseGame();if(typeof window.go==='function')window.go('activity');});
  api.on('chest',function(){if(typeof window.ekCloseGame==='function')window.ekCloseGame();if(typeof window.go==='function')window.go('chest');});
  api.on('locked',function(p){if(typeof window.toast==='function')window.toast('Need '+(Number(p.need)||100)+' game points.');});
  api.on('error',function(p){if(typeof window.toast==='function')window.toast('Game action failed.');});
  window.ekSyncFruitSlash=sync;
  window.addEventListener('keydown',function(e){if(e.key==='Escape'&&typeof window.ekCloseGame==='function')window.ekCloseGame();});
})();
</script>
