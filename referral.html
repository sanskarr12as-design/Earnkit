@supports not (width:1cqw){.referral{--s:calc(min(100vw,430px) / 855)}}
.referral .stage{position:relative;width:100%;aspect-ratio:855/1420;overflow:hidden}
.referral .art{position:absolute;left:calc((var(--x) - var(--ox,0)) * var(--s));top:calc((var(--y) - var(--oy,0)) * var(--s));width:calc(var(--w) * var(--s));height:calc(var(--h) * var(--s));background-image:var(--src);background-repeat:no-repeat;background-size:calc(var(--W) * var(--s)) auto;background-position:calc(var(--x) * -1 * var(--s)) calc(var(--y) * -1 * var(--s))}
.referral .it{position:absolute;display:flex;align-items:center;opacity:0;transition:opacity .25s;box-sizing:border-box;white-space:nowrap;line-height:1;font-variant-numeric:lining-nums;pointer-events:none}
.referral.live .it{opacity:1}
.referral .it.wrap{white-space:normal;line-height:1.18}
.referral .it.serif{font-family:"Playfair Display","Times New Roman",Times,"Noto Serif",serif}
.referral .fill{position:absolute;transform-origin:left center;transform:scaleX(0);transition:transform .7s cubic-bezier(.2,.8,.2,1);background:linear-gradient(#d93a62,#a3113a);border-radius:99px;opacity:0}
.referral.live .fill{opacity:1}
.referral .zone{position:absolute;cursor:pointer;border-radius:calc(30 * var(--s));overflow:hidden;transition:transform .12s;outline:none}
.referral .zone:active{transform:scale(.97)}
.referral .zone:focus-visible{box-shadow:0 0 0 2px #fff,0 0 0 4px #c2185b}
.referral .zone.loading{opacity:.7;pointer-events:none}
.referral .zone.err{animation:referralshake .4s}
.referral .zone.shine:after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(0) skewX(-20deg);animation:referralsh 3.6s ease-in-out infinite}
.referral.paused .zone.shine:after{animation-play-state:paused}
@keyframes referralsh{0%,55%{transform:translateX(0) skewX(-20deg)}100%{transform:translateX(560%) skewX(-20deg)}}
@keyframes referralshake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.referral .zone.shine:after{animation:none}.referral .fill,.referral .it{transition:none}}

<script id="ek-referral-tracking-v1">
/* EarnKit referral tracking: friend opens ?startapp=ref_EK<id> -> registered once (first referrer wins) -> referrer sees it live */
(function(){
'use strict';
var R=function(){return CONFIG.referral||{}};
var base=function(){return String(R().dbUrl||'').replace(/\/+$/,'')+'/'+(R().root||'earnkit')};
var tg=function(){return window.Telegram&&window.Telegram.WebApp};
var me=function(){var u=tg()&&tg().initDataUnsafe&&tg().initDataUnsafe.user;return u&&u.id?u:null};
function J(url,opt){return fetch(url,Object.assign({cache:'no-store'},opt||{})).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})}
function put(url,obj){return J(url,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)})}
function startParam(){var p=tg()&&tg().initDataUnsafe&&tg().initDataUnsafe.start_param;if(!p){try{var q=new URLSearchParams(location.search+'&'+location.hash.replace(/^#/,''));p=q.get('tgWebAppStartParam')||q.get('startapp')||''}catch(e){}}return p||''}
function parseRef(p){var m=/^ref_(?:EK)?(\d{4,15})$/.exec(p||'');return m?m[1]:''}

/* Friend side: register once */
async function register(){
  var u=me();if(!u)return;
  var refId=parseRef(startParam());
  if(!refId||String(u.id)===refId)return;
  var st=state.referrals;if(st.referredBy)return;
  var name=[u.first_name,u.last_name].filter(Boolean).join(' ').slice(0,40),now=Date.now(),b=base();
  try{
    var prev=await J(b+'/referredBy/'+u.id+'.json');
    if(prev&&prev.by&&String(prev.by)!==refId){st.referredBy=String(prev.by);persist();return;}
    if(!prev){await put(b+'/referredBy/'+u.id+'.json',{by:refId,t:now});}
    try{await put(b+'/refs/'+refId+'/'+u.id+'.json',{n:name,u:u.username||'',t:now});}catch(e){if(!prev)throw e;}
    st.referredBy=refId;persist();
  }catch(e){console.warn('EarnKit referral register failed, will retry next open',e);}
}

/* Referrer side: pull joined friends, update counter + activity */
var last=0,busy=false,again=false,syncTimer=null;
async function sync(force){
  var u=me();if(!u)return;
  if(busy){again=true;return;}
  var now=Date.now(),wait=(force?800:5000)-(now-last);
  if(wait>0){if(!syncTimer)syncTimer=setTimeout(function(){syncTimer=null;sync(true)},wait);return;}
  last=now;busy=true;
  try{
    var d=await J(base()+'/refs/'+u.id+'.json'),ids=d?Object.keys(d):[],st=state.referrals;
    var known=Array.isArray(st.joinedIds)?st.joinedIds:[],fresh=ids.filter(function(i){return known.indexOf(i)<0});
    if(fresh.length){
      st.joinedIds=known.concat(fresh).slice(-3000);
      st.count=(Number(st.count)||0)+fresh.length;
      st.tracked=ids.length;
      fresh.forEach(function(i){var n=(d[i]&&d[i].n)||'';try{record('Referral: friend joined'+(n?' ('+n+')':''),0,'referral','ID '+i)}catch(e){}});
      persist();
      var nm=d[fresh[fresh.length-1]]&&d[fresh[fresh.length-1]].n;
      try{toast('🎉 '+(fresh.length>1?fresh.length+' new friends joined':(nm||'A friend')+' joined via your link'),'success')}catch(e){}
      try{if(currentRoute==='referral'||currentRoute==='home'||currentRoute==='challengeReferral')renderRoute()}catch(e){}
    }
  }catch(e){console.warn('EarnKit referral sync failed',e);}
  busy=false;
  if(again){again=false;sync(true);}
}

/* Fast tracking: realtime stream + polling fallback */
var es=null,poll=null;
function live(){
  var u=me();if(!u||es||!window.EventSource)return;
  try{
    es=new EventSource(base()+'/refs/'+u.id+'.json');
    var h=function(){sync(true)};
    es.addEventListener('put',h);es.addEventListener('patch',h);
    es.onerror=function(){try{es.close()}catch(_){}es=null;setTimeout(live,15000)};
  }catch(e){es=null}
}
function stop(){try{es&&es.close()}catch(_){}es=null}

function boot(){
  var tries=0,t=setInterval(function(){
    tries++;
    if(me()||tries>40){
      clearInterval(t);
      if(!me())return;
      ekRefCode();
      register().then(function(){sync(true)});
      live();
      poll=setInterval(function(){sync(false)},30000);
    }
  },250);

<script id="ek-referral-native-integration">
(function(){
  'use strict';
  if(window.__ekReferralReplacementInstalled)return;
  window.__ekReferralReplacementInstalled=true;

  var cache=document.createDocumentFragment();
  var refRoot=document.getElementById('referral');
  var msRoot=document.getElementById('milestones');
  if(!refRoot||!msRoot||!window.Referral||!window.Milestones)return;
  window.__ekReferralSourceRoots=[refRoot,msRoot];
  cache.appendChild(refRoot);
  cache.appendChild(msRoot);

  function codeValue(){
    var c='';
    try{c=typeof ekRefCode==='function'?ekRefCode():'';}catch(e){}
    if(!c){
      try{
        if(!state.referrals.code){state.referrals.code='EK'+String(typeof uid==='function'?uid():'').slice(0,8);persist();}
        c=state.referrals.code||'';
      }catch(e){}
    }
    return String(c||'');
  }
  function referralCount(){
    try{return Math.max(0,Number(state.referrals.count)||0);}catch(e){return 0;}
  }
  function syncSourceData(){
    try{
      var r=state.referrals||{},count=referralCount(),claimed=Array.isArray(r.msClaimed)?r.msClaimed:[];
      var active=r.active!=null?Math.max(0,Number(r.active)||0):count;
      var earned=Math.max(0,Number(r.earned)||0);
      window.Referral.set({
        perFriend:'$0.03',perLbl:'per friend',pct:'30%',pctLbl:'eligible earnings',
        code:codeValue(),invited:String(count),invitedLbl:'Invited',
        active:String(active),activeLbl:'Active',earned:earned.toFixed(2),earnedLbl:'Earned'
      });
      window.Milestones.set({
        opened:claimed.length,total:5,viewAll:'View All >',
        tiers:[1,3,5,10,25].map(function(need){return {need:need,have:count};})
      });
    }catch(e){console.warn('EarnKit referral data sync failed',e);}
  }

  /* Keep all original source artwork, CSS transitions, shine animations and hit zones. */
  window.Referral.init({demo:false});
  window.Milestones.init({demo:false});

  window.Referral.on('copy',function(){
    var c='';try{c=state.referrals.code||codeValue();}catch(e){}
    if(typeof copyText==='function')copyText(c);
  });

  function claimTier(index){
    var thresholds=[1,3,5,10,25],t=thresholds[index];
    if(!t)return;
    var count=referralCount(),claimed=Array.isArray(state.referrals.msClaimed)?state.referrals.msClaimed:[];
    if(count<t){
      var zones=msRoot.querySelectorAll('.zone'),zone=zones[index+2];
      if(zone){zone.classList.add('err');setTimeout(function(){zone.classList.remove('err');},450);}
      if(typeof toast==='function')toast('Invite '+(t-count)+' more friend'+((t-count)===1?'':'s')+' to unlock this chest.');
      return;
    }
    if(claimed.indexOf(t)>-1){if(typeof toast==='function')toast('Already claimed.');return;}
    /* Reuse EarnKit's existing local milestone claim engine and credit() flow. */
    var b=document.createElement('button');
    b.type='button';b.setAttribute('data-rfx-claim',String(t));
    b.style.cssText='position:fixed;left:-10000px;top:0;width:1px;height:1px;opacity:0;';
    document.body.appendChild(b);b.click();b.remove();
    syncSourceData();
  }
  window.Milestones.on('tier',function(p){claimTier(Number(p&&p.index));});
  window.Milestones.on('viewAll',function(){if(typeof go==='function')go('leaderboard');});
  window.Milestones.on('open',function(){if(typeof go==='function')go('leaderboard');});
  window.Milestones.on('openAll',function(){
    var first=msRoot.querySelectorAll('.zone')[2];
    if(first)first.scrollIntoView({behavior:'smooth',block:'center'});
  });

  /* Override only the Referral view. All other EarnKit routes keep their original renderers. */
  referralView=function(){
    return '<section class="screen active" data-screen="referral"><div id="ekReferralPageMount"></div></section>';
  };

  var baseRenderRoute=renderRoute;
  renderRoute=function(){
    /* Preserve the exact authored stage nodes and their listeners when the app swaps routes. */
    var currentRef=document.getElementById('referral');
    var currentMs=document.getElementById('milestones');
    if(currentRef&&currentRef.parentNode)cache.appendChild(currentRef);
    if(currentMs&&currentMs.parentNode)cache.appendChild(currentMs);
    var result=baseRenderRoute.apply(this,arguments);
    if(typeof currentRoute!=='undefined'&&currentRoute==='referral'){
      var mount=document.getElementById('ekReferralPageMount');
      if(mount){
        mount.appendChild(cache);
        syncSourceData();
      }
    }
    return result;
  };

  /* If the file is opened directly on a referral hash, render it after the bridge is ready. */
  try{if(typeof currentRoute!=='undefined'&&currentRoute==='referral')renderRoute();}catch(e){}
})();

</script>
